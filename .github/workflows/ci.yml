name: Backend CI

on:
  push:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main workflow while it is mutating the server.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-unit-coverage:
    name: Backend unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

  lint:
    name: Backend static analysis (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

  backend-unit-coverage:
    name: Backend unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build isolated test image
        run: docker build --tag backend-ci .
      - name: Run unit tests with branch coverage
        run: |
          docker create --name backend-unit-coverage --entrypoint sh backend-ci \
            -c "coverage run --branch --source=app.core,app.schemas,app.model_registry -m unittest discover -s tests -p 'test_name_search.py' -v && coverage run --append -m unittest discover -s tests -p 'test_*_unit.py' -v && coverage report -m && coverage xml -o /tmp/coverage.xml"
          docker start -a backend-unit-coverage
          docker cp backend-unit-coverage:/tmp/coverage.xml coverage-backend.xml
      - name: Upload backend coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-unit-coverage
          path: coverage-backend.xml
          if-no-files-found: error
      - name: Remove temporary coverage container
        if: always()
        run: docker rm -f backend-unit-coverage || true

  backend-checks:
    name: Backend integration, migrations and health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build and start isolated services
        run: docker compose -f compose.ci.yaml up --build --wait --wait-timeout 180
      - name: Run backend integration tests
        run: docker compose -f compose.ci.yaml exec -T backend python tests/run_integration.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.ci.yaml logs --no-color
      - name: Remove temporary CI services and data
        if: always()
        run: docker compose -f compose.ci.yaml down --volumes --remove-orphans

  production-checks:
    name: Backend production tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate production configuration
        run: |
          bash -n scripts/deploy-ci.sh
          python3 scripts/test_deploy.py
          docker compose --env-file production.env.example -f compose.production.yaml config --quiet
      - name: Build production image and migrate isolated database
        run: docker compose -f compose.production-ci.yaml up --build --wait --wait-timeout 180
      - name: Run tests against production backend
        run: docker compose -f compose.production-ci.yaml exec -T backend python -m unittest discover -s tests -v
      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.production-ci.yaml logs --no-color
      - name: Clean isolated services
        if: always()
        run: docker compose -f compose.production-ci.yaml down --volumes --remove-orphans

  required-checks:
    name: Backend required checks
    if: always()
    needs: [lint, backend-unit-coverage, backend-checks, production-checks]
    runs-on: ubuntu-latest
    steps:
      # main only receives release/* and hotfix/*; this check is already required on main.
      - name: Check PR source branch
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*) ;;
            *) echo "::error::Las PR hacia main solo pueden salir de release/* o hotfix/* (esta sale de $HEAD_REF)."; exit 1 ;;
          esac
      - env:
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.backend-unit-coverage.result }}
          INTEGRATION: ${{ needs.backend-checks.result }}
          PRODUCTION: ${{ needs.production-checks.result }}
        run: test "$LINT" = success && test "$UNIT" = success && test "$INTEGRATION" = success && test "$PRODUCTION" = success

  publish:
    name: Publish backend image
    needs: required-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.required-checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build and publish versioned image
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker build --file Dockerfile.production --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" .
          # Test the exact image that will be published, not a separate rebuild.
          docker tag "$image" fintech-backend-production-ci
          trap 'docker compose -f compose.production-ci.yaml down --volumes --remove-orphans; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker compose -f compose.production-ci.yaml up --no-build --wait --wait-timeout 180
          docker compose -f compose.production-ci.yaml exec -T backend python -m unittest discover -s tests -v
          docker compose -f compose.production-ci.yaml down --volumes --remove-orphans
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          docker pull "$image"

          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest="$(
            docker image inspect "$image" |
              jq -r --arg prefix "$repository@sha256:" \
                '.[0].RepoDigests[] | select(startswith($prefix))' |
              head -n 1
          )"

          [[ "$digest" =~ ^ghcr.io/ub-es-f4-2026/backend@sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::No se ha encontrado el digest publicado en GHCR"
            exit 1
          }

          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '### Backend image\nCommit: `%s`\n\n`%s`\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy backend
    needs: [required-checks, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && needs.required-checks.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Deploy exact published digest
        env:
          COMPONENT: backend
          IMAGE: ${{ needs.publish.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/deploy-ci.sh
