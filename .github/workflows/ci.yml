name: Backend CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main workflow while it is mutating the server.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-checks:
    name: Backend build, migrations and health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build and start isolated services
        run: docker compose -f compose.ci.yaml up --build --wait --wait-timeout 180
      - name: Run backend tests
        run: docker compose -f compose.ci.yaml exec -T backend python -m unittest discover -s tests -v
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.ci.yaml logs --no-color
      - name: Remove temporary CI services and data
        if: always()
        run: docker compose -f compose.ci.yaml down --volumes --remove-orphans

  production-checks:
    name: Backend production tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate production configuration
        run: |
          bash -n scripts/deploy-ci.sh
          python3 scripts/test_deploy.py
          docker compose --env-file production.env.example -f compose.production.yaml config --quiet
      - name: Build production image and migrate isolated database
        run: docker compose -f compose.production-ci.yaml up --build --wait --wait-timeout 180
      - name: Run tests against production backend
        run: docker compose -f compose.production-ci.yaml exec -T backend python -m unittest discover -s tests -v
      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.production-ci.yaml logs --no-color
      - name: Clean isolated services
        if: always()
        run: docker compose -f compose.production-ci.yaml down --volumes --remove-orphans

  required-checks:
    name: Backend required checks
    if: always()
    needs: [backend-checks, production-checks]
    runs-on: ubuntu-latest
    steps:
      - env:
          DEVELOPMENT: ${{ needs.backend-checks.result }}
          PRODUCTION: ${{ needs.production-checks.result }}
        run: test "$DEVELOPMENT" = success && test "$PRODUCTION" = success

  publish:
    name: Publish backend image
    needs: required-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.required-checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build and publish versioned image
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker build --file Dockerfile.production --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" .
          # Test the exact image that will be published, not a separate rebuild.
          docker tag "$image" fintech-backend-production-ci
          trap 'docker compose -f compose.production-ci.yaml down --volumes --remove-orphans; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker compose -f compose.production-ci.yaml up --no-build --wait --wait-timeout 180
          docker compose -f compose.production-ci.yaml exec -T backend python -m unittest discover -s tests -v
          docker compose -f compose.production-ci.yaml down --volumes --remove-orphans
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          docker pull "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '### Backend image\nCommit: `%s`\n\n`%s`\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy backend
    needs: [required-checks, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && needs.required-checks.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Deploy exact published digest
        env:
          COMPONENT: backend
          IMAGE: ${{ needs.publish.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/deploy-ci.sh
