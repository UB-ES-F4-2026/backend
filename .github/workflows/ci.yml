name: Backend CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend build, migrations and health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated services
        run: docker compose -f compose.ci.yaml up --build --wait --wait-timeout 180
      - name: Run backend tests
        run: docker compose -f compose.ci.yaml exec -T backend python -m unittest discover -s tests -v
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.ci.yaml logs --no-color
      - name: Remove temporary CI services and data
        if: always()
        run: docker compose -f compose.ci.yaml down --volumes --remove-orphans
