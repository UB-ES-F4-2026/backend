name: fintech-prod

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:?Required}
  POSTGRES_USER: ${POSTGRES_USER:?Required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
  DB_HOST: db
  DB_PORT: "5432"
  DB_POOL_SIZE: "2"
  DB_MAX_OVERFLOW: "1"

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  db:
    image: postgres:17-bookworm
    environment: *db-env
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=1MB", "-c", "maintenance_work_mem=16MB"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${BACKEND_IMAGE:?Use a tested image digest}
    profiles: ["tools"]
    environment: *db-env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 160m
    logging: *logging
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:?Use a tested image digest}
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy
    init: true
    mem_limit: 160m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 15s

  caddy:
    image: ${WEB_IMAGE:?Use a tested image digest}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
